{% extends "base.html" %}

{% block title %}Page Not Found - Jozini Move{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-6">
            <i class="fas fa-search fa-5x text-muted mb-4"></i>
            <h1 class="display-1 fw-bold text-primary">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            <p class="text-muted mb-4">Oops! The page you're looking for doesn't exist or has been moved.</p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <a href="{{ url_for('shop.browse') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-store me-2"></i>Browse Shops
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
