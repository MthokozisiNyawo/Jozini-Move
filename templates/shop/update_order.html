{% extends "base.html" %}

{% block title %}Update Order Status - {{ order.order_number }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0"><i class="fas fa-truck me-2"></i>Update Order #{{ order.order_number }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="status" class="form-label">Order Status</label>
                            <select name="status" class="form-select" required>
                                <option value="confirmed" {% if order.order_status == 'confirmed' %}selected{% endif %}>Confirm Order</option>
                                <option value="preparing" {% if order.order_status == 'preparing' %}selected{% endif %}>Preparing</option>
                                <option value="ready" {% if order.order_status == 'ready' %}selected{% endif %}>Ready for Pickup</option>
                                <option value="cancelled" {% if order.order_status == 'cancelled' %}selected{% endif %}>Cancel Order</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes (Optional)</label>
                            <textarea name="notes" class="form-control" rows="3" placeholder="Add any notes for the customer..."></textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Status
                            </button>
                            <a href="{{ url_for('shop.shop_dashboard') }}" class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
